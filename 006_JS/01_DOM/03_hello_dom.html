<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>나의 헤딩</h1>
    <p>나의 문장이 있는 곳</p>
    <div id="output">
      <!-- 동적 콘텐츠 채울 곳 -->
    </div>
    <button onclick="sayHello()">여기는 나의 버튼</button>
    <script>
      function sayHello() {
        console.log("sayhello");
        const myOutput = document.getElementById("output");
        console.log(myOutput);
        myOutput.textContent = "새로운 동적 문장";
      }
    </script>
  </body>
</html>
