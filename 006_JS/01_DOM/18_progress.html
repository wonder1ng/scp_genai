<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #progressBar {
        width: 100%;
        background-color: #dfffb2;
      }
      #progress {
        width: 0%;
        height: 30px;
        background-color: #ffa806;
        text-align: center;
      }
      #progress Text {
        position: absolute;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>프로그래스바</h1>
    <input type="number" id="timeInput" placeholder="초를 입력하세요" min="1" />
    <button onclick="startProgress()" id="startButton">시작</button>
    <button onclick="clearProgress()">초기화</button>
    <div id="progressBar">
      <div id="progress"><span id="progressText">0%</span></div>
    </div>
    <script>
      let interval;
      const timeInput = document.getElementById("timeInput");
      const progress = document.getElementById("progress");
      const progressText = document.getElementById("progressText");
      const startButton = document.getElementById("startButton");

      function startProgress() {
        startButton.disabled = true;
        duration = parseInt(timeInput.value);
        console.log("입력 초: ", duration);

        let elapsed = 0;
        const timerId = setInterval(() => {
          console.log("반복호출");
          elapsed++;
          const ratio = (100 * elapsed) / duration;
          progress.style.width = `${ratio}%`;
          progressText.textContent = `${ratio}%`;
          console.log(progress);

          if (ratio >= 100) {
            clearInterval(timerId);
            startButton.disabled = false;
          }
        }, 1000);
      }

      function clearProgress() {
        if (timerId) clearInterval(timerId);
        progress.style.width = "2px";
        timeInput.value = "";
        progressText.textContent = `0%`;
        startButton.disabled = false;
      }
    </script>
  </body>
</html>
