      const guessButton = document.getElementById("guessButton");
      const answer = document.getElementById("answer");
      let newAnswer = answer.innerText.split(" ");
      let chances = document.getElementById("chances");
      const uses = document.getElementById("uses");
      const state = document.getElementById("state");
      let inp = document.getElementById("letter");

      inp.addEventListener("input", () => {
        // 영어가 아닌 문자 제거
        inp.value = inp.value.replace(/[^a-zA-Z]/g, "");

        // 1글자 제한까지 같이 처리
        inp.value = inp.value.slice(0, 1);
      });

      function guess() {
        // 로직 구현
        let letter = inp.value.toLowerCase();
        let use = Array.from(uses.innerText.replace(", ", ""));
        if (use.includes(letter)) {
          state.innerText = "이미 사용한 글자입니다.";
        } else if (inp.value == "") {
          state.innerText = "글자를 입력하세요.";
        } else {
          let incorrect = true;
          word.forEach((v, i) => {
            if (v == letter) {
              newAnswer[i] = v;
              incorrect = false;
              if (newAnswer.includes("_")) {
                state.innerText = `${letter}는 포함되는 글자입니다.`;
              } else {
                state.innerText = `축하합니다! 단어는 ""${word.join("")}"" 였습니다. 🎉`;
                guessButton.disabled = true;
              }
            }
          });
          uses.innerHTML += uses.innerHTML.length ? ", " + letter : letter;
          answer.innerText = newAnswer.join(" ");
          inp.value = "";

          if (incorrect) {
            chances.innerText = parseInt(chances.innerText) - 1;
            if (parseInt(chances.innerText))
              state.innerText = `없는 글자입니다.`;
            else {
              state.innerText = `아쉽습니다. 모든 기회를 다 사용하였습니다. 단어는  ""${word.join("")}"" 였습니다.`;
              guessButton.disabled = true;
            }
          }
        }
      }
      function newGame() {
        location.reload();
