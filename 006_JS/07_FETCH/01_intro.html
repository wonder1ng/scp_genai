<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>외부 요청 테스트</h1>
    <button id="loadBtn">데이터 요청</button>
    <div id="result"></div>

    <script>
      document.getElementById("loadBtn").addEventListener("click", () => {
        console.log("버튼 클릭됨");
        fetch("https://localhost:5000/api/data")
          .then((response) => {
            if (!response.ok) {
              console.log("응답은 왔으나, OK가 아님: ", response);
              throw new Error("알 수 없는 오류가 발생했습니다.");
            }
            console.log(
              "성공적인 응답이 왔음. 응답은 여기 담겨 있음: ",
              response,
            );
            return response.json();
          })
          .then((data) => {
            console.log("최종 파싱이 끝난 json 자료 구조: ", data);
          })
          .catch((error) => {
            console.log("위에 fetch 처리 중 오류가 발생: ", error);
          });
      });
    </script>
  </body>
</html>
