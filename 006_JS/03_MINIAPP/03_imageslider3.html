<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      h1 {
        text-align: center;
      }
      .slider {
        display: flex;
        flex-direction: column;
        margin: 0 auto;
        text-align: center;
        max-width: 600px;
        align-items: center;
      }
      .slider img {
        max-width: 100%;
        height: 300px;
        display: none;
      }
      .slider img.active {
        display: block;
      }
      .buttons {
        margin-top: 20px;
      }
      button {
        padding: 10px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <h1>이미지 슬라이더</h1>
    <div class="slider">
      <img src="images/01.jpg" id="img1" class="active" />
      <img src="images/02.jpg" id="img2" />
      <img src="images/03.jpg" id="img3" />
      <div class="filename" id="filename">images/01.jpg</div>
      <div class="buttons">
        <button id="prevBtn">이전</button>
        <button id="nextBtn">다음</button>
      </div>
    </div>
    <script>
      const imgs = Array.from(document.getElementsByTagName("img"));
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      let active = 0;
      console.log(imgs[0].className);
      prevBtn.addEventListener("click", () => {});

      const large = document.getElementById("large-image");
      Array.from(document.getElementsByTagName("img"))
        .slice(0, -1)
        .forEach((v) => {
          v.addEventListener("click", () => {
            large.src = v.src;
            large.width = "400";
            large.style.display = "block";
          });
        });
    </script>
  </body>
</html>
