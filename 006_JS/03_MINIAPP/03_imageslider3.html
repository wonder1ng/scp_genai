<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      h1 {
        text-align: center;
      }
      .slider {
        display: flex;
        flex-direction: column;
        margin: 0 auto;
        text-align: center;
        max-width: 600px;
        align-items: center;
      }
      .slider img {
        max-width: 100%;
        height: 300px;
        display: none;
      }
      .slider img.active {
        display: block;
      }
      .buttons {
        margin-top: 20px;
      }
      button {
        padding: 10px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <h1>이미지 슬라이더</h1>
    <div class="slider">
      <img src="images/01.jpg" id="img1" class="active" />
      <img src="images/02.jpg" id="img2" />
      <img src="images/03.jpg" id="img3" />
      <div class="filename" id="fineName">images/01.jpg</div>
      <div class="buttons">
        <button id="prevBtn">이전</button>
        <button id="nextBtn">다음</button>
      </div>
    </div>
    <script>
      const imgs = document.getElementsByTagName("img");
      const [prev, next] = document.getElementsByTagName("button");
      const fineName = document.getElementById("fineName");
      let active = 0;

      const show = (n) => {
        imgs[active].classList.remove("active");
        active = (active + n + imgs.length) % imgs.length;
        imgs[active].classList.add("active");
        fineName.textContent = imgs[active].getAttribute("src");
      };
      prev.onclick = () => show(-1);
      next.onclick = () => show(1);
    </script>
  </body>
</html>
