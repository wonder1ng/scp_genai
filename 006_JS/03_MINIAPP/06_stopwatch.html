<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #1e1e2f;
        font-family: Arial, sans-serif;
      }

      .stopwatch-box {
        background: #2c2c3e;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        text-align: center;
        width: 300px;
      }

      h1 {
        color: white;
        margin-bottom: 20px;
      }

      #time {
        font-size: 40px;
        color: #00ffcc;
        margin-bottom: 25px;
        letter-spacing: 2px;
        font-family: monospace;
      }

      .button-container {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }

      button {
        flex: 1;
        padding: 10px;
        font-size: 14px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
      }

      #Start {
        background: #4caf50;
        color: white;
      }

      #Stop {
        background: #f44336;
        color: white;
      }

      #Reset {
        background: #2196f3;
        color: white;
      }

      button:hover {
        opacity: 0.85;
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <div class="stopwatch-box">
      <h1>스탑워치</h1>

      <div id="time">00:00.00</div>

      <div class="button-container">
        <button id="Start">Start</button>
        <button id="Stop">Stop</button>
        <button id="Reset">Reset</button>
      </div>
    </div>
    <script>
      let time = document.getElementById("time");
      const [strat, stoper, reset] = document.getElementsByTagName("button");
      let interval = 0;
      let startTime;
      let pastTime;
      let format = (n) => String(Math.floor(n)).padStart(2, "0");

      const timerStart = () => {
        if (interval) return;
        startTime = Date.now() - (pastTime || 0);
        interval = setInterval(() => {
          pastTime = Date.now() - startTime;
          time.textContent = `${format(pastTime / 60000)}:${format((pastTime / 1000) % 60)}.${format((pastTime / 10) % 100)}`;
        });
      };
      strat.addEventListener("click", () => timerStart());
      stoper.addEventListener("click", () => {
        clearInterval(interval);
        interval = 0;
      });
      reset.addEventListener("click", () => {
        time.textContent = "00:00.00";
        clearInterval(interval);
        startTime = pastTime = interval = 0;
      });
    </script>
  </body>
</html>
