<!-- 기존 코드 동일 (중간 생략 없음, 수정 없음) -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      canvas {
        border: 1px solid #000;
      }
    </style>
    <title>Snake Game</title>
  </head>
  <body>
    <canvas id="canvas" width="300" height="300"></canvas>
    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const snake = {
        x: [0],
        y: [0],
        size: 10,
        speed: 100,
        direction: 1,
      };

      const apple = {
        x:
          Math.floor(Math.random() * (canvas.width / snake.size - 1) + 1) *
          snake.size,
        y:
          Math.floor(Math.random() * (canvas.height / snake.size - 1) + 1) *
          snake.size,
        size: snake.size,
        loc: false,
      };

      function drawSnake() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        snake.x.forEach((_, i) => {
          ctx.fillStyle = "blue";
          ctx.fillRect(snake.x[i], snake.y[i], snake.size, snake.size);
        });
      }

      function drawApple() {
        ctx.save();
        while (!apple.loc) {
          apple.loc = true;
          for (let i = 0; i < snake.x.length; i++) {
            if (snake.x[i] === apple.x && snake.y[i] === apple.y) {
              apple.x =
                Math.floor(Math.random() * (canvas.width / snake.size)) *
                snake.size;
              apple.y =
                Math.floor(Math.random() * (canvas.height / snake.size)) *
                snake.size;
              apple.loc = false;
            }
          }
        }
        ctx.fillStyle = "red";
        ctx.fillRect(apple.x, apple.y, apple.size, apple.size);
        ctx.restore();
      }

      function moveSnake() {
        switch (snake.direction) {
          case 0:
            snake.y.unshift(snake.y[0] - snake.size);
            snake.x.unshift(snake.x[0]);
            break;
          case 1:
            snake.y.unshift(snake.y[0] + snake.size);
            snake.x.unshift(snake.x[0]);
            break;
          case 2:
            snake.x.unshift(snake.x[0] - snake.size);
            snake.y.unshift(snake.y[0]);
            break;
          case 3:
            snake.x.unshift(snake.x[0] + snake.size);
            snake.y.unshift(snake.y[0]);
            break;
        }

        if (apple.x === snake.x[0] && apple.y === snake.y[0]) {
          apple.loc = false;
        } else {
          snake.x.pop();
          snake.y.pop();
        }

        for (let i = 1; i < snake.x.length; i++) {
          if (snake.x[i] === snake.x[0] && snake.y[i] === snake.y[0]) {
            gameOver();
          }
        }

        if (
          snake.x[0] >= canvas.width ||
          snake.x[0] < 0 ||
          snake.y[0] < 0 ||
          snake.y[0] >= canvas.height
        ) {
          gameOver();
        }
      }

      document.addEventListener("keydown", (e) => {
        switch (e.key.toLowerCase()) {
          case "arrowup":
          case "w":
            snake.direction = 0;
            break;
          case "arrowdown":
          case "s":
            snake.direction = 1;
            break;
          case "arrowleft":
          case "a":
            snake.direction = 2;
            break;
          case "arrowright":
          case "d":
            snake.direction = 3;
            break;
        }
      });

      gameStart = setInterval(() => {
        autoPlay(); // 🔥 AI

        // 🔥 핵심 추가: 이동 가능 여부 체크
        if (!hasAnyMove()) {
          gameOver();
          return;
        }
        moveSnake();
        drawSnake();
        drawApple();
      }, snake.speed);

      function gameOver() {
        clearInterval(gameStart);
        sec = Math.floor(performance.now() / 1000);
        min = Math.floor(sec / 60);
        if (
          confirm(
            `${min}분 ${sec % 60}초 동안 ${snake.x.length - 1}개의 사과를 먹었습니다.\n다시 시작하시겠습니까?`,
          )
        )
          location.reload();
      }

      function autoPlay() {
        const headX = snake.x[0];
        const headY = snake.y[0];

        let bestDir = snake.direction;
        let bestScore = -Infinity;

        for (let dir = 0; dir < 4; dir++) {
          let x = headX;
          let y = headY;

          if (dir === 0) y -= snake.size;
          if (dir === 1) y += snake.size;
          if (dir === 2) x -= snake.size;
          if (dir === 3) x += snake.size;

          // ❌ 벽 즉사
          if (x < 0 || y < 0 || x >= canvas.width || y >= canvas.height)
            continue;

          // ❌ 자기 몸 충돌 즉사
          let hitBody = false;
          for (let i = 0; i < snake.x.length; i++) {
            if (snake.x[i] === x && snake.y[i] === y) {
              hitBody = true;
              break;
            }
          }
          if (hitBody) continue;

          // =========================
          // 점수 계산
          // =========================
          let score = 0;

          // 🟡 사과 거리 (가까울수록 좋음)
          const dist = Math.abs(apple.x - x) + Math.abs(apple.y - y);
          score -= dist;

          // 🟢 공간 확보 (중요: 생존 우선)
          score += floodFill(x, y) * 2;

          // 🟠 사과 방향 보너스 (안전할 때만 의미 있음)
          if (Math.abs(apple.x - headX) < Math.abs(apple.y - headY)) {
            if (
              (apple.x > headX && dir === 3) ||
              (apple.x < headX && dir === 2)
            )
              score += 50;
          } else {
            if (
              (apple.y > headY && dir === 1) ||
              (apple.y < headY && dir === 0)
            )
              score += 50;
          }

          // 🧠 너무 좁은 길 패널티 (꼬리 갇힘 방지)
          if (floodFill(x, y) < snake.x.length / 2) {
            score -= 200;
          }

          if (score > bestScore) {
            bestScore = score;
            bestDir = dir;
          }
        }

        snake.direction = bestDir;
      }

      /* =========================
   🧠 공간 계산 (생존 핵심)
   ========================= */
      function floodFill(x, y) {
        const visited = new Set();
        const queue = [{ x, y }];
        let count = 0;

        while (queue.length) {
          const cur = queue.shift();
          const key = cur.x + "," + cur.y;

          if (visited.has(key)) continue;
          visited.add(key);
          count++;

          const moves = [
            [0, -snake.size],
            [0, snake.size],
            [-snake.size, 0],
            [snake.size, 0],
          ];

          for (let [dx, dy] of moves) {
            const nx = cur.x + dx;
            const ny = cur.y + dy;

            if (nx < 0 || ny < 0 || nx >= canvas.width || ny >= canvas.height)
              continue;

            let blocked = false;
            for (let i = 0; i < snake.x.length; i++) {
              if (snake.x[i] === nx && snake.y[i] === ny) {
                blocked = true;
                break;
              }
            }

            if (!blocked) {
              queue.push({ x: nx, y: ny });
            }
          }
        }

        return count;
      }

      function hasAnyMove() {
        const headX = snake.x[0];
        const headY = snake.y[0];

        const moves = [
          [0, -snake.size],
          [0, snake.size],
          [-snake.size, 0],
          [snake.size, 0],
        ];

        for (let [dx, dy] of moves) {
          const nx = headX + dx;
          const ny = headY + dy;

          // 벽 체크
          if (nx < 0 || ny < 0 || nx >= canvas.width || ny >= canvas.height)
            continue;

          // 몸 체크
          let blocked = false;
          for (let i = 0; i < snake.x.length; i++) {
            if (snake.x[i] === nx && snake.y[i] === ny) {
              blocked = true;
              break;
            }
          }

          if (!blocked) return true;
        }

        return false;
      }
    </script>
  </body>
</html>
