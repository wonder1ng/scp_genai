<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      canvas {
        border: 1px solid black;
      }
    </style>
  </head>
  <body>
    <canvas id="myCanvas" width="400" height="300"></canvas>
    <script>
      const canvas = document.getElementById("myCanvas");
      const context = canvas.getContext("2d");

      context.fillStyle = "#FF0000";
      context.fillRect(50, 50, 200, 100); // x, y, width, height
      // style에서
      context.fillStyle = "#0000FF";
      context.fillRect(50, 150, 200, 100); // x, y, width, height

      // 라인 그리기
      context.strokeStyle = "#00FF00";
      context.lineWidth = 5;
      context.beginPath();
      context.moveTo(150, 50);
      context.lineTo(250, 150);
      context.lineTo(150, 250);
      context.lineTo(50, 150);
      context.lineTo(150, 50);
      context.stroke(); // 위의 지시대로 그리기
      context.closePath();

      // 원 그리기
      context.fillStyle = "#FFFF00";
      context.beginPath();
      context.arc(350, 50, 30, 0, 2 * Math.PI); // x, y, 반지름(radius), 출발각도, 끝각도(360)
      // 각도는 radian 기준으로 입력하며 0은 3시에서 시작하여 시계 방향으로 이동하며 2π가 360도(degree)
      context.fill();
      context.closePath();

      context.fillStyle = "#000";
      context.beginPath();
      context.arc(350, 150, 30, 0, 5); // x, y, 반지름(radius), 출발각도, 끝각도(360)
      context.fill();
      context.closePath();
      console.log(Math.PI);

      context.fillStyle = "#00FFFF";
      context.beginPath();
      context.arc(350, 250, 30, (Math.PI * 1) / 2, (3 / 2) * Math.PI); // x, y, 반지름(radius), 출발각도, 끝각도(360)
      context.fill();
      context.closePath();
      console.log(Math.PI);
    </script>
  </body>
</html>
