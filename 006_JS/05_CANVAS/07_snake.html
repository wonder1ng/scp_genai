<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      canvas {
        border: 1px solid #000;
      }
    </style>
    <title>Snake Game</title>
  </head>
  <body>
    <canvas id="canvas" width="300" height="300"></canvas>
    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const snake = {
        x: [0],
        y: [0],
        size: 10,
        speed: 100,
        // 0: 상, 1: 하, 2: 좌, 3: 우
        direction: 1,
      };
      const apple = {
        x:
          Math.floor(Math.random() * (canvas.width / snake.size - 1) + 1) *
          snake.size,
        y:
          Math.floor(Math.random() * (canvas.height / snake.size - 1) + 1) *
          snake.size,
        size: snake.size,
        loc: false,
      };

      function drawSnake() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();

        snake.x.forEach((v, i) => {
          ctx.save();
          ctx.translate(snake.x[i], snake.y[i]);
          ctx.fillStyle = "blue";
          ctx.fillRect(0, 0, snake.size, snake.size);
          ctx.restore();
        });
      }

      function drawApple() {
        ctx.save();
        while (!apple.loc) {
          apple.loc = true;
          for (let i = 0; i < snake.x.length; i++) {
            if (snake.x[i] === apple.x && snake.y[i] === apple.y) {
              apple.x =
                Math.floor(Math.random() * (canvas.width / snake.size)) *
                snake.size;
              apple.y =
                Math.floor(Math.random() * (canvas.height / snake.size)) *
                snake.size;
              apple.loc = false;
            }
          }
        }
        ctx.translate(apple.x, apple.y);
        ctx.fillStyle = "red";
        ctx.fillRect(0, 0, apple.size, apple.size);
        ctx.restore();
      }

      function moveSnake() {
        switch (snake.direction) {
          case 0:
            snake.y.unshift(snake.y[0] - snake.size);
            snake.x.unshift(snake.x[0]);
            break;
          case 1:
            snake.y.unshift(snake.y[0] + snake.size);
            snake.x.unshift(snake.x[0]);
            break;
          case 2:
            snake.x.unshift(snake.x[0] - snake.size);
            snake.y.unshift(snake.y[0]);
            break;
          case 3:
            snake.x.unshift(snake.x[0] + snake.size);
            snake.y.unshift(snake.y[0]);
            break;
        }

        if (apple.x === snake.x[0] && apple.y === snake.y[0]) {
          apple.loc = false;
        } else {
          snake.x.pop();
          snake.y.pop();
        }

        for (let i = 1; i < snake.x.length; i++) {
          if (snake.x[i] === snake.x[0] && snake.y[i] === snake.y[0]) {
            gameOver();
          }
        }
        if (
          snake.x[0] >= canvas.width ||
          snake.x[0] < 0 ||
          snake.y[0] < 0 ||
          snake.y[0] >= canvas.height
        ) {
          gameOver();
        }
      }

      document.addEventListener("keydown", (e) => {
        switch (e.key.toLowerCase()) {
          case "arrowup":
          case "w":
            if (snake.y.length != 1) {
              snake.direction = snake.y[1] < snake.y[0] ? snake.direction : 0;
            } else snake.direction = 0;
            break;
          case "arrowdown":
          case "s":
            if (snake.y.length != 1) {
              snake.direction = snake.y[1] > snake.y[0] ? snake.direction : 1;
            } else snake.direction = 1;
            break;
          case "arrowleft":
          case "a":
            if (snake.x.length != 1) {
              snake.direction = snake.x[1] < snake.x[0] ? snake.direction : 2;
            } else snake.direction = 2;
            break;
          case "arrowright":
          case "d":
            if (snake.x.length != 1) {
              snake.direction = snake.x[1] > snake.x[0] ? snake.direction : 3;
            } else snake.direction = 3;
            break;
        }
      });
      gameStart = setInterval(() => {
        moveSnake();
        drawSnake();
        drawApple();
      }, snake.speed);

      function gameOver() {
        clearInterval(gameStart);
        sec = Math.floor(performance.now() / 1000);
        min = Math.floor(sec / 60);
        if (
          confirm(
            `${min}분 ${sec % 60}초 동안 ${snake.x.length - 1}개의 사과를 먹었습니다.\n다시 시작하시겠습니까?`,
          )
        )
          location.reload(true);
      }
    </script>
  </body>
</html>
